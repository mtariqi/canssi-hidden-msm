name: ci
on: [push, pull_request]
jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: unit tests
        run: pytest -q tests
      - name: synthetic data + cohort + prior predictive
        run: |
          python scripts/00_make_synthetic_ices.py
          python scripts/01_build_cohort.py
          python scripts/02_prior_predictive.py
      - name: simulation smoke test (time-boxed)
        run: python scripts/03_run_simulation.py --mode pilot --budget 120 --out results/sim_ci
      - uses: actions/upload-artifact@v4
        with: {name: figures, path: results/figures}
